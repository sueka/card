<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>sueka/card</title>
    <link href="./main.css" rel="stylesheet" />
    <meta name="robots" content="noindex" />

    <!-- For <twitter-sn>, <github-username> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/brands.min.css" integrity="sha512-EJp8vMVhYl7tBFE2rgNGb//drnr1+6XKMvTyamMS34YwOEFohhWkGq13tPWnK0FbjSS6D8YoA3n3bZmb3KiUYA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- For <web-site> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/solid.min.css" integrity="sha512-/r+0SvLvMMSIf41xiuy19aNkXxI+3zb/BN8K9lnDDWI09VM0dwgTMzK7Qi5vv5macJ3VH4XZXr60ip7v13QnmQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- For <qr-code> -->
    <script type="importmap">
      {
        "imports": {
          "qrcode": "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm"
        }
      }
    </script>

    <!-- For <braille-guide> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">

    <!-- Custom elements -->
    <script type="module" src="./BizCard.js"></script>
    <script type="module" src="./BackFace.js"></script>
    <script type="module" src="./Ordinary.js"></script>
    <script type="module" src="./Icon.js"></script>
    <script type="module" src="./Title.js"></script>
    <script type="module" src="./FullName.js"></script>
    <script type="module" src="./BioInfo.js"></script>
    <script type="module" src="./QrCode.js"></script>
    <script type="module" src="./AccountList.js"></script>
    <script type="module" src="./TwitterSn.js"></script>
    <script type="module" src="./GitHubUsername.js"></script>
    <script type="module" src="./WebSite.js"></script>
    <script type="module" src="./BrailleGuide.js"></script>
  </head>
  <body>
    <biz-card ipafont bg-color="azure">
      <ordinary- type="chief" size="12.4667mm" color="paleturquoise"></ordinary->
      <icon- rounded src="./assets/images/github-icon.svg"></icon->
      <full-name>Sueka</full-name>
      <bio-info>
        こんにちは
      </bio-info>
      <qr-code rounded link content="https://card.sueka.me" dark="#191970" light="#fff0f5"></qr-code>

      <!-- Accounts -->
      <account-list>
        <twitter-sn squared>
          <a href="https://x.com/hsueka">@hsueka</a>
        </twitter-sn>
        <github-username squared>
          <a href="https://github.com/sueka">sueka</a>
        </github-username>
        <web-site logo-color="gold">
          <a href="https://sueka.me">https://sueka.me</a>
        </web-site>
      </account-list>

      <back-face bg-color="white">
        <qr-code standalone rounded link content="https://github.com/sueka/card" dark="#0006" light="#0001"></qr-code>
      </back-face>

      <braille-guide>
        ⠹⠋⠡ <!-- スエカ --> <br>
        ⠠⠦⠓⠞⠞⠏⠎⠐⠂⠌⠌ <!-- https:// --> <br>
        ⠈⠉⠁⠗⠙⠲ <!-- card. --> <br>
        ⠈⠎⠥⠑⠅⠁⠲⠍⠑⠠⠴ <!-- sueka.me -->
      </braille-guide>
    </biz-card>
  </body>
</html>
